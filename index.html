<body>
<div class="role-switch"><button class="role-btn on-p" id="rP">参加者</button><button class="role-btn" id="rA">管理者</button></div>

if(ep!==null){var es2=to+ep;if(es2+2<=l){var et=v.getUint16(es2,!be);

// My記録
function renderMy(){
var nm=$('iName').value.trim(),sel=$('selMyEv').value,list=$('myList'),no=$('noRec');
if(!nm){list.innerHTML='';no.innerHTML='<p>名前を「申請」タブで入力すると表示されます</p>';no.style.display='block';return}
var recs=D.catches.filter(function(c){return c.name===nm&&(!sel||c.ev===sel)});
if(!recs.length){list.innerHTML='';no.style.display='block';no.innerHTML='まだ申請がありません';return}
no.style.display='none';var h='';
recs.forEach(function(r){var sc=r.status==='approved'?'b-ok':r.status==='pending'?'b-pend':'b-ng',st=r.status==='approved'?'承認済':r.status==='pending'?'審査中':'却下',dt=r.dt?r.dt.replace('T',' '):r.time;
h+='<div class="hi"><div class="th">🐟</div><div class="inf"><div class="t1">'+r.fish+' '+r.size+'cm</div><div class="t2">'+dt+' | '+r.ev+(r.memo?' | '+r.memo:'')+'</div></div><span class="badge '+sc+'">'+st+'</span></div>'});
list.innerHTML=h}

// ランキング
function renderRk(){
var sel=$('selRkEv').value,ap=D.catches.filter(function(c){return c.status==='approved'&&(!sel||c.ev===sel)});
var pl={};ap.forEach(function(c){if(!pl[c.name])pl[c.name]={name:c.name,total:0,best:0,cnt:0,fish:[]};pl[c.name].total+=c.size;pl[c.name].cnt++;if(c.size>pl[c.name].best)pl[c.name].best=c.size;pl[c.name].fish.push(c)});
var rk=Object.values(pl).sort(function(a,b){return b.total-a.total});
var ph='';if(rk.length>=3){ph='<div class="podium"><h3>🏆 TOP 3</h3><div class="pod-row"><div class="pod-i p2"><div class="ri">🥈</div><div class="pn">'+rk[1].name+'</div><div class="pv">'+rk[1].total.toFixed(1)+'</div><div class="pl">cm</div><div class="bar"></div></div><div class="pod-i p1"><div class="ri">🥇</div><div class="pn">'+rk[0].name+'</div><div class="pv">'+rk[0].total.toFixed(1)+'</div><div class="pl">cm</div><div class="bar"></div></div><div class="pod-i p3"><div class="ri">🥉</div><div class="pn">'+rk[2].name+'</div><div class="pv">'+rk[2].total.toFixed(1)+'</div><div class="pl">cm</div><div class="bar"></div></div></div></div>'}
$('podArea').innerHTML=ph;
var lh='';rk.forEach(function(p,i){var rc=i===0?'rk-1':i===1?'rk-2':i===2?'rk-3':'';
lh+='<div class="rr" data-i="'+i+'"><div class="rk '+rc+'">'+(i+1)+'</div><div class="rn">'+p.name+'</div><div class="rt">'+p.total.toFixed(1)+'</div><div class="rc">'+p.cnt+'匹</div></div>';
lh+='<div class="rd" id="rd'+i+'">';p.fish.sort(function(a,b){return b.size-a.size}).forEach(function(f){lh+='<div class="rd-f"><span>'+f.fish+' '+f.size+'cm</span><span>'+f.time+'</span></div>'});lh+='</div>'});
$('rkList').innerHTML=lh;
document.querySelectorAll('.rr').forEach(function(r){r.addEventListener('click',function(){var d=$('rd'+this.getAttribute('data-i'));d.classList.toggle('on')})})}

// CSV
$('bCSV').addEventListener('click',function(){
var sel=$('selRkEv').value,ap=D.catches.filter(function(c){return c.status==='approved'&&(!sel||c.ev===sel)});
var pl={};ap.forEach(function(c){if(!pl[c.name])pl[c.name]={name:c.name,total:0,best:0,cnt:0};pl[c.name].total+=c.size;pl[c.name].cnt++;if(c.size>pl[c.name].best)pl[c.name].best=c.size});
var rk=Object.values(pl).sort(function(a,b){return b.total-a.total}),d=[['順位','名前','合計(cm)','最大(cm)','匹数']];
rk.forEach(function(p,i){d.push([i+1,p.name,p.total.toFixed(1),p.best.toFixed(1),p.cnt])});
var csv='\uFEFF'+d.map(function(r){return r.join(',')}).join('\n'),bl=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='ranking.csv';a.click()});
